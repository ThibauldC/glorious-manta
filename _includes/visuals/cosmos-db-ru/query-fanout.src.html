<!doctype html>
<html lang="en" data-register="paper">
<head>
<title>Without a customer key, SQL searches each physical partition</title>
<link rel="stylesheet" href="kit.css" data-ve-kit>
<style>/* COSMOS_STYLE */</style>
</head>
<body><main>
<header><p class="eyebrow">Query scope</p><h1>All-customer SQL fans out</h1></header>
<figure>
<div class="frame"><svg class="ve-svg" viewBox="0 0 760 310" role="img" aria-label="A query scoped to customer-42 searches physical partition A. A query for all customers searches the local indexes on A, B and C, then Cosmos DB combines the results.">
<path class="ve-e" d="M200 70H485"/><text class="ve-el" x="340" y="54">route one customer</text>
<path class="ve-e is-hot" d="M200 230H350V120H485"/>
<path class="ve-e is-hot" d="M350 230V185H485"/>
<path class="ve-e is-hot" d="M350 230V260H485"/>
<text class="ve-el" x="342" y="211">fan out</text>
<g class="ve-n"><rect class="sh" x="15" y="30" width="185" height="80"/><text x="107" y="60">One customer</text><text class="sub" x="107" y="85">customerId + status</text></g>
<g class="ve-n is-key"><rect class="sh" x="15" y="195" width="185" height="80"/><text x="107" y="225">All customers</text><text class="sub" x="107" y="250">status = "open"</text></g>
<g class="ve-n"><rect class="sh" x="485" y="30" width="260" height="105"/><text x="615" y="60">Physical partition A</text><text class="sub" x="615" y="90">seek index → load matches</text><text class="sub" x="615" y="115">includes customer-42</text></g>
<g class="ve-n"><rect class="sh" x="485" y="155" width="260" height="60"/><text x="615" y="174">Physical partition B</text><text class="sub" x="615" y="198">seek index → load matches</text></g>
<g class="ve-n"><rect class="sh" x="485" y="235" width="260" height="60"/><text x="615" y="254">Physical partition C</text><text class="sub" x="615" y="278">seek index → load matches</text></g>
</svg></div>
<figcaption><span class="fig-n">Fig. 1</span>Without a partition-key scope, Cosmos DB runs local query work across physical partitions and combines the results.</figcaption>
</figure>
<p>Conceptual example, not a measured RU multiplier. Three physical partitions do not imply three times the total query charge.</p>
<section class="sources" aria-label="Sources"><p><a href="https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-query-container">Microsoft: In-partition and cross-partition queries</a>.</p></section>
</main><script type="module">/* COSMOS_RUNTIME */</script></body>
</html>
